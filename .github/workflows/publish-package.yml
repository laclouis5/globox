name: Publish Python Package

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.14"

      - name: Build distributions
        run: uv build

      - name: Publish the package
        run: uv publish --token ${{ secrets.PYPI_API_TOKEN }}
